<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="500 plus tickets per day, 5000 plus managed IPs, 95 plus Lighthouse score, 4 published papers, 5 first-author manuscripts in the pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="150" fill="#0F1A2E"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#E8EEF5" font-size="44" font-weight="700">
    <text x="60" y="72">500+</text>
    <text x="300" y="72">5,000+</text>
    <text x="540" y="72">95+</text>
    <text x="780" y="72">4</text>
    <text x="960" y="72">5</text>
  </g>
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" fill="#9FB3CC" font-size="14">
    <text x="60" y="102">tickets handled per day</text>
    <text x="300" y="102">IPs under management</text>
    <text x="540" y="102">Lighthouse under load</text>
    <text x="780" y="102">papers published</text>
    <text x="960" y="102">first-author manuscripts</text>
    <text x="960" y="122">in the pipeline</text>
  </g>
  <g stroke="#DCE6F2" stroke-opacity="0.15">
    <line x1="270" y1="32" x2="270" y2="118"/>
    <line x1="510" y1="32" x2="510" y2="118"/>
    <line x1="750" y1="32" x2="750" y2="118"/>
    <line x1="930" y1="32" x2="930" y2="118"/>
  </g>
  <!-- single draw-in on load -->
  <line x1="60" y1="138" x2="1140" y2="138" stroke="#3DDBD0" stroke-width="2" stroke-dasharray="1080" stroke-dashoffset="1080">
    <animate attributeName="stroke-dashoffset" from="1080" to="0" dur="1.6s" fill="freeze" begin="0.2s"/>
  </line>
</svg>

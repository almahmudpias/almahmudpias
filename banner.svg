<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Md Abdullah Al Mahmud Pias. Federated and multimodal learning research, production systems engineering." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1A2E"/>
      <stop offset="1" stop-color="#17294A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DCE6F2" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDBD0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3DDBD0" stop-opacity="0"/>
    </radialGradient>
    <!-- upstream paths: client -> server -->
    <path id="u1" d="M930 65 L930 210"/>
    <path id="u2" d="M1055.6 137.5 L930 210"/>
    <path id="u3" d="M1055.6 282.5 L930 210"/>
    <path id="u4" d="M930 355 L930 210"/>
    <path id="u5" d="M804.4 282.5 L930 210"/>
    <path id="u6" d="M804.4 137.5 L930 210"/>
    <!-- downstream paths: server -> client -->
    <path id="d1" d="M930 210 L930 65"/>
    <path id="d2" d="M930 210 L1055.6 137.5"/>
    <path id="d3" d="M930 210 L1055.6 282.5"/>
    <path id="d4" d="M930 210 L930 355"/>
    <path id="d5" d="M930 210 L804.4 282.5"/>
    <path id="d6" d="M930 210 L804.4 137.5"/>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="930" cy="210" r="210" fill="url(#glow)"/>

  <!-- orbit -->
  <g>
    <circle cx="930" cy="210" r="145" fill="none" stroke="#DCE6F2" stroke-opacity="0.18" stroke-dasharray="3 9"/>
    <animateTransform attributeName="transform" type="rotate" from="0 930 210" to="360 930 210" dur="90s" repeatCount="indefinite"/>
  </g>

  <!-- links -->
  <g stroke="#DCE6F2" stroke-opacity="0.22" stroke-width="1.2">
    <use href="#u1"/><use href="#u2"/><use href="#u3"/><use href="#u4"/><use href="#u5"/><use href="#u6"/>
  </g>

  <!-- client nodes: shape encodes modality (circle, square, triangle) -->
  <g fill="#FFC15A">
    <g transform="translate(930 65)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="10"/>
    </g>
    <g transform="translate(1055.6 137.5)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3.6s" begin="0.5s" repeatCount="indefinite"/></circle>
      <rect x="-9" y="-9" width="18" height="18" rx="2"/>
    </g>
    <g transform="translate(1055.6 282.5)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
      <polygon points="0,-11 10,8 -10,8"/>
    </g>
    <g transform="translate(930 355)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle r="10"/>
    </g>
    <g transform="translate(804.4 282.5)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <rect x="-9" y="-9" width="18" height="18" rx="2"/>
    </g>
    <g transform="translate(804.4 137.5)">
      <circle r="20" fill-opacity="0.14"><animate attributeName="r" values="16;26;16" dur="3.3s" begin="1.9s" repeatCount="indefinite"/></circle>
      <polygon points="0,-11 10,8 -10,8"/>
    </g>
  </g>

  <!-- server -->
  <g transform="translate(930 210)">
    <circle r="34" fill="#3DDBD0" fill-opacity="0.16"><animate attributeName="r" values="30;42;30" dur="4s" repeatCount="indefinite"/></circle>
    <circle r="22" fill="#3DDBD0"/>
    <circle r="8" fill="#0F1A2E"/>
  </g>

  <!-- upstream packets (coral): local prototypes -->
  <g fill="#FF6F61">
    <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#u1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.9s" repeatCount="indefinite" begin="0.4s"><mpath href="#u2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.7s" repeatCount="indefinite" begin="0.9s"><mpath href="#u3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.1s" repeatCount="indefinite" begin="1.3s"><mpath href="#u4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" begin="1.7s"><mpath href="#u5"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" begin="2.1s"><mpath href="#u6"/></animateMotion></circle>
  </g>
  <!-- downstream packets (teal): global prototype -->
  <g fill="#3DDBD0">
    <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.3s"><mpath href="#d1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.9s" repeatCount="indefinite" begin="1.7s"><mpath href="#d2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.7s" repeatCount="indefinite" begin="2.2s"><mpath href="#d3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3.1s" repeatCount="indefinite" begin="0.2s"><mpath href="#d4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.6s"><mpath href="#d5"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="3s" repeatCount="indefinite" begin="1s"><mpath href="#d6"/></animateMotion></circle>
  </g>

  <!-- name -->
  <text x="60" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#E8EEF5">Md Abdullah Al Mahmud Pias</text>
  <text x="60" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#9FB3CC">Reliable, privacy-aware machine learning systems</text>

  <!-- cycling proof lines -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#3DDBD0">
    <text x="60" y="252" opacity="0">Trains models where the data cannot move.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.35;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="252" opacity="0">Runs a helpdesk that peaks past 1,000 tickets a day.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.63;0.68;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="252" opacity="0">Published with IEEE, Springer and Wiley (Q2).
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- legend -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#9FB3CC">
    <circle cx="66" cy="336" r="4" fill="#FF6F61"/>
    <text x="80" y="340">local prototype leaves a client</text>
    <circle cx="66" cy="362" r="4" fill="#3DDBD0"/>
    <text x="80" y="366">global prototype returns to every client</text>
    <text x="60" y="394" fill-opacity="0.75">circle, square, triangle: three modalities, raw data never moves</text>
  </g>
</svg>
